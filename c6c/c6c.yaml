# c6c 自身的工程管理清单（`c6c build/test/package/install` 的 dogfood 样本）
# 自举产物直接落在 build/c6c；构建机用宿主 cc 引导（C6_ENABLE_TCC=OFF），不依赖 tcc。
name: c6c
version: 0.6.3
kind: app
out: build/c6c
sources:
  - src/c6c.c6
include:
  - .
  - include
flags:
pkg_name: c6c
pkg_desc: c6c - the c6 compiler written in c6 (self-hosting)
pkg_license: MIT
# 发行版打包用：DESTDIR="${pkgdir}" c6c install --prefix=/usr
# 命令行 / DESTDIR 环境变量优先于这里的默认值。
destdir: pkg
prefix: /usr
dev_flags:
release_flags:
pkg_formats:
  - tgz
pkg_files:
  - build/c6c:bin/c6c
  - lib/rt.c6:lib/c6/rt.c6
  - include/stddef.h:lib/c6/include/stddef.h
  - include/stdarg.h:lib/c6/include/stdarg.h
  - include/stdint.h:lib/c6/include/stdint.h
  - include/c6lib.h:include/c6lib.h
