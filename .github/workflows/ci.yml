name: build, test and package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_regression:
        description: '额外跑完整回归矩阵 check-all（较慢，需要 node/clang/qemu）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 别在这里放全局 `CMAKE_INSTALL_PREFIX: /usr`：CMake 把同名环境变量当作
# **默认值**，而用例里还有"再 configure 一遍自己"的（c6c/tests/pkgcheck.sh 装
# 一棵临时前缀的树、check-install 装 stage）。环境变量漏进去会让那些嵌套配置
# 也按 /usr 算——Debian 系的 GNUInstallDirs 在 prefix=/usr 时把 libdir 定成
# lib/x86_64-linux-gnu，于是用例断言里的 lib/… 全部对不上（CI 上 pkgcheck 就
# 是这么红的：安装树"缺 lib/libc6c.a …"、pkgconf 找不到 c6lib.pc）。
# 每个真正需要 /usr 的 configure 都在自己的命令行里显式 -DCMAKE_INSTALL_PREFIX。

jobs:
  # -------------------------------------------------------------------------
  # 编译 + 测试：两种 libtcc 形态（静态 / 共享）、两个 Ubuntu LTS。
  # -------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, shared=${{ matrix.shared }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        shared: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils texinfo perl pkgconf

      - name: Configure
        run: |
          # 这个 job 校验的是 tcc 形态（daily 矩阵 / libtcc 共享矩阵），
          # 显式钉住：仓库默认已改为只构建 c6c（见 CHANGELOG 0.6.3）。
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DC6_ENABLE_TCC=ON \
            -DC6_TCC_SHARED_LIBTCC=${{ matrix.shared }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test (CTest daily)
        run: ctest --test-dir build -L daily --output-on-failure

      # 校验 DESTDIR 安装树里的 CMake 包配置与 pkgconf 元数据：
      # check-install 会 staged install、configure 一个消费方工程、链接并运行。
      - name: Verify installed library config
        run: |
          cmake --build build --target check-install
          PKG_CONFIG_PATH="$PWD/build/check-install/stage/usr/lib/pkgconfig" \
            pkgconf --modversion c6
          PKG_CONFIG_PATH="$PWD/build/check-install/stage/usr/lib/pkgconfig" \
            pkgconf --cflags --libs c6
          PKG_CONFIG_PATH="$PWD/build/check-install/stage/usr/lib/pkgconfig" \
            pkgconf --static --libs c6
          LD_LIBRARY_PATH="$PWD/build/check-install/stage/usr/lib" \
            ./build/check-install/stage/usr/bin/c6 -v

  # -------------------------------------------------------------------------
  # c6c：用 c6 语言写的自举编译器（独立子目录 `c6c/`，三个后端）。
  #
  # 它没有自己的构建系统：全部目标是 CMake target（`cmake/C6C.cmake`），
  # 一条 `cmake --build build --target check-all-c6c` 覆盖验收 (1)(2)(3)：
  # 自举 fixpoint 逐字节、全部后端同一套用例、tests+std+诊断语料、c6c 编出上游
  # tcc 并让它跑 tests2（含**第三代 selfhost**：那个 tcc 再编一遍 tcc.c）。
  # 默认形态（stage0 = 宿主 C 编译器，C6_ENABLE_TCC=OFF）：构建阶段不产出
  # tcc/c6 / libtcc，只生成 tcc 的配置头供语料使用；显式 OFF 写在这里，
  # 防止默认值将来被改动时这条 job 悄悄走回 tcc。
  # -------------------------------------------------------------------------
  c6c:
    name: c6c (c6 写的自举编译器)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils texinfo perl pkgconf python3

      # c6c 是 CMake 里的 `c6c` 目标（`cmake/C6C.cmake`），stage0 = 宿主 cc，
      # `cmake --build build` 就会编出 c6c/build/c6c；不依赖任何 tcc 产物。
      - name: Configure and build (c6 + c6c)
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DC6_ENABLE_TCC=OFF \
            -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"
          ls -l c6c/build/c6c
          test ! -e tcc/c6
          test ! -e tcc/libtcc.a
          test ! -e tcc/libtcc.so

      # 验收 (1)(2)(3)：自举 fixpoint 逐字节、三后端同一套语料、tests+std+诊断、
      # c6c 编出上游 tcc 并让它跑 tests2（含**第三代 selfhost**），外加 tcc 上游
      # tests1 与 tests2 闸门（`c6c/tests/tcc-na.txt` 里登记不到的失败一律算意外
      # 失败）。label `c6c` 就是这四条；`perf` 单独跑。
      - name: 验收 c6c（fixpoint / 三后端 / 语料 / 编出 tcc / 上游 tests1·tests2）
        run: ctest --test-dir build -L c6c -LE perf --output-on-failure

      # 验收 (4) 的性能/内存门槛。共享 runner 抖动 ±10%，门槛是按开发机定的，
      # 所以只作参考、不挡流水线。
      - name: 性能与内存门槛（runner 抖动大，仅参考）
        continue-on-error: true
        run: ctest --test-dir build -L perf --output-on-failure

  # -------------------------------------------------------------------------
  # no-tcc：tcc 退出工具链的那条路（`-DC6_ENABLE_TCC=OFF`）。
  #
  # 只用一个系统 C 编译器把 c6c 编出来：c6c 的源码是 C99 兼容的单 TU
  # （`src/c6c.c6` 把各模块 #include 进来），所以 stage0 可以是 cc，
  # 整条**构建**里没有任何 tcc 构建产物——不编 tcc、不链 libtcc。tcc/ 只以
  # 源码形式留下（c6c 的 build-tcc 与 tests1/tests2 闸门把它当语料）。
  #
  # 验收阶段会有一次例外，写在下面 ctest 那步的注释里：G2c 要一个能用的 tcc
  # 来编 tcc 的运行时（libtcc1.a），c6c-tcc-corpus 这个 target 会用 cc 现编一个
  # 当夹具。
  #
  # 这条作业是"能退"的机器证据：它红了就说明 c6c 又悄悄依赖上 tcc 了。
  # -------------------------------------------------------------------------
  no-tcc:
    name: no-tcc (只靠 cc 引导 c6c)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils python3

      - name: Configure and build without tcc
        run: |
          cmake -S . -B build-notcc \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DC6_ENABLE_TCC=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DBUILD_TESTING=ON
          cmake --build build-notcc --parallel "$(nproc)"
          ls -l c6c/build/c6c
          # 硬证据：构建完也没有 tcc 编译器、也没有 libtcc。
          test ! -e tcc/c6
          test ! -e tcc/libtcc.a
          test ! -e tcc/libtcc.so
          # 构建阶段唯一碰 tcc/ 的是它的**配置文件**（config.h / config.mak），
          # 由 tcc/CMakeLists.txt 生成：c6c 的 build-tcc 把 tcc 的源码当语料编，
          # 那份源码 `#include "config.h"`。它不是 tcc 的构建产物。

      # 验收 (1)(2)(3)：自举 fixpoint / 三后端 / tests+std+诊断 / 编出 tcc
      # 并让它跑上游 tests1·tests2。G2c 判的是"c6c 编出的 tcc 能不能工作"，
      # 所以需要一个已知能工作的 tcc 来编 tcc 的 C 运行库 libtcc1.a：宿主 cc
      # 直接编的运行时不等价（实测 102/144，第三代 selfhost 坏 8），
      # 因此在这里用 cc 现编 `tcc/c6` 当夹具（不安装、不进交付物），编出的
      # c6c-built tcc 逐条对齐产品构建的 118/144、坏 0。
      - name: 验收 c6c（stage0 = gcc）
        run: ctest --test-dir build-notcc -L c6c -LE perf --output-on-failure

      # 同一件事的单条 target 入口，顺带证明 selfhost 不依赖整条 ctest 链。
      - name: selfhost（stage0 = gcc，CMake target）
        run: cmake --build build-notcc --target selfhost

  # -------------------------------------------------------------------------
  # 完整回归矩阵（92 个 std-*、自举、freestanding、tests2 等）。
  # 手动触发或 v* tag 发布时运行；release 依赖本 job，tag 上不会被跳过。
  # -------------------------------------------------------------------------
  regression:
    name: full regression (CTest -L regression)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_regression) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 缺工具链时 bare/wasm/c99 用例会静默跳过，门禁形同虚设：
      # qemu-system-x86 给 fstest-qemu，clang 给 C99/wasm，golang-go 给
      # fstest-go / fstest-bare-go，qemu-user 给交叉运行。
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils texinfo perl pkgconf \
            qemu-user qemu-system-x86 clang golang-go nodejs
      - name: Configure and build
        run: |
          # 完整回归矩阵（-L regression）的被测编译器是 tcc/c6，显式钉住。
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib -DC6_ENABLE_TCC=ON -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"
      # aux（check-tcc / ubcheck / safegate / bench-async）不属于回归门禁；
      # bench-async 需要 g++/rustc/go/uya，用 check-aux 在完整环境里单独跑。
      - name: Full regression matrix
        run: ctest --test-dir build -L regression -LE aux -j "$(nproc)" --output-on-failure
      - name: Lightweight auxiliary checks
        run: ctest --test-dir build -L aux -E '^bench-async$' --output-on-failure

  # -------------------------------------------------------------------------
  # 打包：DEB / RPM / TGZ，全部复用同一份 install() 清单。
  # -------------------------------------------------------------------------
  package:
    name: package (${{ matrix.generator }})
    needs: [test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        generator: [DEB, RPM, TGZ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils texinfo perl dpkg-dev rpm

      - name: Check version identity
        run: |
          # 版本号只有一个来源（根 VERSION），但代码里还有一处镜像：c6c/src/c6c.c6
          # 的 C6C_VERSION（`c6c --version` 打的就是它）。两处漂了会发出
          # 「包名 0.6.1、编译器自称 0.6.0」的包，这里直接挡住。
          _ver=$(tr -d '\n' < VERSION)
          _macro=$(sed -n 's/^#define C6C_VERSION "\(.*\)"$/\1/p' c6c/src/c6c.c6)
          if [ "$_ver" != "$_macro" ]; then
            echo "::error::VERSION（${_ver}）与 c6c/src/c6c.c6 的 C6C_VERSION（${_macro}）不一致"
            exit 1
          fi
          # CHANGELOG 仍是给人看的变更史（同时随包装进 /usr/share/doc/c6/），
          # 所以该版本的段落必须在。
          if ! grep -q "^## ${_ver} — " CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有「## ${_ver} — 」段落"
            exit 1
          fi
          # 发版说明的**唯一来源**是「主题为 `c6 <版本>` 的那个提交」的正文
          # （release job 只做取用和排版，见下面 release job）。在这里先确认
          # 它在、正文非空——否则三种包都打完了才在最后一步红。
          _c=$(git log --format='%H%x09%s' HEAD \
                 | awk -F'\t' -v want="c6 ${_ver}" '$2 == want { print $1; exit }')
          if [ -z "$_c" ]; then
            echo "::error::找不到主题为「c6 ${_ver}」的版本提交：它是发版说明的来源"
            exit 1
          fi
          if ! git log -1 --format='%b' "$_c" | grep -q '[^[:space:]]'; then
            echo "::error::版本提交 $(git rev-parse --short "$_c") 没有正文"
            exit 1
          fi

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # tag 只是触发器：两者不一致就会发出「v0.2.0 的 Release 里躺着 0.1.0
          # 的包」，这里直接挡住。
          _ver="v$(tr -d '\n' < VERSION)"
          if [ "$_ver" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION 文件（${_ver}）不一致"
            exit 1
          fi

      - name: Package release metadata
        id: meta
        run: |
          echo "release=${GITHUB_RUN_NUMBER}.$(git rev-parse --short=7 HEAD)" \
            >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          # Release 里发的仍是 c6 包（tcc 形态），显式钉住；c6c 包由
          # package-c6c job 单独产出验收。
          cmake -S . -B build-pkg \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DC6_ENABLE_TCC=ON \
            -DC6_TCC_SHARED_LIBTCC=ON \
            -DBUILD_TESTING=OFF \
            -DC6_PACKAGE_RELEASE="${{ steps.meta.outputs.release }}"

      - name: Build
        run: cmake --build build-pkg --parallel "$(nproc)"

      - name: Package (${{ matrix.generator }})
        run: |
          mkdir -p packages
          cpack --config build-pkg/CPackConfig.cmake \
            -G "${{ matrix.generator }}" -B packages

      - name: Inspect package
        run: |
          # CPack 的中间目录不能进 artifact/release：否则 sha256sum * 会碰到目录
          rm -rf packages/_CPack_Packages
          ls -lh packages/
          # 自举编译器 c6c 必须和它的自带头文件、rt.c6 成套出现：c6c 按 argv[0]
          # 找 <bin>/../lib/c6/{include,rt.c6}，缺一个就编不了任何程序。
          case "${{ matrix.generator }}" in
            DEB)
              dpkg-deb --info packages/*.deb
              dpkg-deb --contents packages/*.deb | head -40
              dpkg-deb --contents packages/*.deb | grep -q 'usr/share/doc/c6/docs/README.md'
              dpkg-deb --contents packages/*.deb | grep -q 'usr/bin/c6c'
              dpkg-deb --contents packages/*.deb | grep -q 'usr/lib/c6/rt.c6'
              ;;
            RPM)
              rpm -qip packages/*.rpm
              rpm -qlp packages/*.rpm | head -40
              rpm -qlp packages/*.rpm | grep -q 'usr/share/doc/c6/docs/README.md'
              rpm -qlp packages/*.rpm | grep -q 'usr/bin/c6c'
              rpm -qlp packages/*.rpm | grep -q 'usr/lib/c6/rt.c6'
              ;;
            TGZ)
              tar tzf packages/*.tar.gz | head -40
              tar tzf packages/*.tar.gz | grep -q 'usr/share/doc/c6/docs/README.md'
              tar tzf packages/*.tar.gz | grep -q 'usr/bin/c6c'
              tar tzf packages/*.tar.gz | grep -q 'usr/lib/c6/rt.c6'
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.generator }}
          path: packages/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # c6c-only 打包：C6_ENABLE_TCC=OFF，包里没有 tcc——编译器是自举的 c6c
  # （装成 bin/c6 与 bin/c6c），库是 libc6c，运行时是自己的 lib/c6/rt.c6，
  # 文档在 share/doc/c6c。产物名 c6c-*，与上面的 c6 包互斥（Provides: c6 /
  # Conflicts: c6, tcc）。目前只上传为 CI artifact、不进 Release：默认交付物
  # 仍是显式打开 C6_ENABLE_TCC=ON 的 c6 包；默认构建/包是 c6c（见 CHANGELOG 0.6.3）。
  # -------------------------------------------------------------------------
  package-c6c:
    name: package c6c-only (${{ matrix.generator }})
    # 不挂 no-tcc：那条作业量的是 c6c 的语言行为（tests1/tests2 语料），
    # 与打包无关；它红了也不该把打包产物挡掉——这里的作业自己用 gcc 引导
    # c6c、打包、断言包内容。
    needs: [test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        generator: [DEB, RPM, TGZ]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make gcc binutils dpkg-dev rpm

      - name: Configure and build
        run: |
          cmake -S . -B build-notcc \
            -DC6_ENABLE_TCC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTING=OFF \
            -DC6_PACKAGE_RELEASE="${GITHUB_RUN_NUMBER}.$(git rev-parse --short=7 HEAD)"
          cmake --build build-notcc --parallel "$(nproc)"

      - name: Package (${{ matrix.generator }})
        run: |
          mkdir -p packages-notcc
          cpack --config build-notcc/CPackConfig.cmake \
            -G "${{ matrix.generator }}" -B packages-notcc

      - name: Inspect package
        run: |
          rm -rf packages-notcc/_CPack_Packages
          ls -lh packages-notcc/
          case "${{ matrix.generator }}" in
            DEB) list() { dpkg-deb --contents packages-notcc/*.deb; } ;;
            RPM) list() { rpm -qlp packages-notcc/*.rpm; } ;;
            TGZ) list() { tar tzf packages-notcc/*.tar.gz; } ;;
          esac
          list | head -40
          # 该有的：编译器两个名字、自带头文件与运行时、嵌入库、pkgconf、文档。
          for f in usr/bin/c6 usr/bin/c6c usr/lib/c6/rt.c6 usr/lib/c6/include/stddef.h \
                   usr/lib/libc6c.a usr/lib/libc6c.so usr/include/c6lib.h \
                   usr/lib/pkgconfig/c6.pc usr/share/doc/c6c/docs/README.md \
                   usr/share/doc/c6c/copyright; do
            if ! list | grep -q "$f"; then
              echo "::error::c6c 包里缺 $f"
              exit 1
            fi
          done
          # 不该有的：tcc 的实现、它的运行时/文档与兼容命令名。
          for pat in 'usr/lib/tcc' 'libtcc\.a' 'libtcc1\.a' 'usr/bin/tcc' 'tcc-doc' 'tcc\.1'; do
            if list | grep -qE "$pat"; then
              echo "::error::c6c 包里不该有 $pat（那是 tcc flavour 的东西）"
              exit 1
            fi
          done
          if [ "${{ matrix.generator }}" = DEB ]; then
            dpkg-deb --field packages-notcc/*.deb Package Provides Conflicts
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: c6c-packages-${{ matrix.generator }}
          path: packages-notcc/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 发布：仅在 v* tag 上，把三种包 + 校验和发到 GitHub Release。
  # -------------------------------------------------------------------------
  release:
    name: publish release
    # always() 让被跳过的 needs 不阻塞发布，但仍要挡住任何失败/取消；
    # regression 在 v* tag 上一定会运行（见上面 if），所以发布必然等它。
    if: ${{ startsWith(github.ref, 'refs/tags/v') && always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [test, package, regression, c6c]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # checkout 必须排在下载产物**之前**：checkout 默认会在工作区跑
      # `git clean -ffdx`，把下载到 `dist/` 的包（未跟踪文件）一并删掉。
      # 0.6.1 时发布 job 里还没有 checkout（说明取自 CHANGELOG），所以没暴露；
      # v0.6.2 第一次带上它，release 就红了：`Pattern 'dist/*' does not match
      # any files`——dist 被 clean 掉了，而 artifacts 明明下载成功。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tag 注解要历史，浅克隆里读不到

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          ls -lh
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      # Release 的说明不靠手抄、也不靠 GitHub 的自动 commit 列表：正文取自
      # **版本提交**（主题是 `c6 <VERSION>`）的正文 —— 发版时把「改了什么、
      # 怎么验收的」写进那条提交就够了，CI 只负责取用、排版、追加产物清单。
      # tag 注解只当兜底（打 tag 的人通常把标题写在里面），标题也取自它。
      - name: Release notes from version commit
        id: notes
        run: |
          set -eu
          _ver=$(tr -d '\n' < VERSION)
          _tag=${GITHUB_REF_NAME}
          _notes="$RUNNER_TEMP/notes.md"

          # actions/checkout 会把 `refs/tags/<tag>` 重新指向**提交**（日志里是
          # `git fetch ... +<commit-sha>:refs/tags/v0.6.2`），本地 tag 于是从附注
          # tag 变成轻量 tag：`%(contents)` 读到的其实是提交消息，标题和"注解兜底"
          # 都会拿错东西（v0.6.2 的 Release 标题就这么变成了那条修 CI 的提交标题）。
          # 所以先把 tag 对象显式取回来；取不回来就退到只认提交（下面有兜底）。
          if [ "$(git cat-file -t "$_tag" 2>/dev/null || true)" != "tag" ]; then
            git fetch --force --no-tags origin "+refs/tags/$_tag:refs/tags/$_tag" \
              >/dev/null 2>&1 || true
          fi

          # 版本提交：主题正好是 `c6 <版本>`，取最新的一条。
          # 按主题整串比，不用 --grep：后者是子串/正则匹配，`c6 0.6.1` 会连
          # `c6 0.6.10` 一起捞进来。
          _c=$(git log --format='%H%x09%s' "$_tag" \
                 | awk -F'\t' -v want="c6 $_ver" '$2 == want { print $1; exit }')
          # 退一步：最后一个动 VERSION 的提交（版本提交被 rebase/squash 掉时）。
          if [ -z "$_c" ]; then
            _c=$(git log -1 --format='%H' "$_tag" -- VERSION)
          fi
          git log -1 --format='%b' "$_c" > "$_notes"

          # 再退一步：版本提交没有正文时用**附注 tag** 的注解（打 tag 的人通常写了
          # 摘要）。轻量 tag 的 %(contents) 会回落到它指向的提交消息——那正是上面
          # 已经判定为空的东西，所以这里只认附注 tag。
          if ! grep -q '[^[:space:]]' "$_notes"; then
            if [ "$(git cat-file -t "$_tag" 2>/dev/null)" = "tag" ]; then
              git tag -l --format='%(contents)' "$_tag" > "$_notes"
            fi
          fi
          if ! grep -q '[^[:space:]]' "$_notes"; then
            echo "::error::版本提交 $(git rev-parse --short "$_c") 没有正文，tag 注解也是空的"
            exit 1
          fi

          # 产物清单和校验方式跟在说明后面，省得下载的人再问。
          {
            printf '\n### 产物\n\n'
            for f in dist/*; do
              [ -f "$f" ] && printf -- '- `%s`\n' "$(basename "$f")"
            done
            printf '\n校验：下载 `SHA256SUMS` 后在本目录执行 `sha256sum -c SHA256SUMS`。\n'
          } >> "$_notes"

          _title=$(git tag -l --format='%(contents:subject)' "$_tag")
          if [ -z "$_title" ] && [ -n "$_c" ]; then
            _title=$(git log -1 --format='%s' "$_c")
          fi
          [ -n "$_title" ] || _title="c6 $_ver"
          printf 'title=%s\n' "$_title" >> "$GITHUB_OUTPUT"
          echo "--- Release body ---"
          cat "$_notes"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          fail_on_unmatched_files: true
